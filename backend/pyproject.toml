[project]
name = "backend"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.10.20,<4"
dependencies = [
    "Flask>=3.1.3,<4",
    "spotipy>=2.24,<3",
    "python-dotenv>=1.0,<2",
]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.setuptools.package-data]
"*" = ["**/static/**/*", "**/templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
